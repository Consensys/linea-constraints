name: Check compilation

on:
  push:
    branches: [master]
  pull_request:

permissions: {} # lock everything by default (least-privilege)

jobs:
  build:
    name: Compile constraint system
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0

    - name: Install Go Corset
      shell: bash
      run: go install github.com/consensys/go-corset/cmd/go-corset@adb969ee2eb4b09624498a1e954a3685f17e06e1 #v1.2.0-rc4

    - name: Build all forks
      run: make -B all
